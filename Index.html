<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNX Diesel Lab - Pro</title>
    <style>
        /* CSS - O Visual da Aplicação */
        :root {
            --primary: #e6b800; /* Amarelo Diesel */
            --bg: #1a1a1a;
            --card: #262626;
            --text: #ffffff;
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        #ls { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: var(--primary); font-weight: bold; cursor: pointer; }
        #app { display: none; padding: 20px; }
        .sidebar { background: #111; padding: 15px; display: flex; gap: 10px; overflow-x: auto; }
        .view { display: none; }
        .view.active { display: block; }
        .active-nav { border-bottom: 2px solid var(--primary); }
    </style>
</head>
<body>

    <div id="ls">
        <div class="card">
            <h2>SNX Diesel Lab</h2>
            <input type="text" id="lu" placeholder="Utilizador">
            <input type="password" id="lp" placeholder="Senha">
            <button onclick="doLogin()">Entrar</button>
            <p id="lerr" style="color: red; display: none;">Dados incorretos!</p>
        </div>
    </div>

    <div id="app">
        <div class="sidebar">
            <button onclick="goTo('d', this)" class="bn-item active-nav">Dashboard</button>
            <button onclick="goTo('i', this)" class="bn-item">Injetores</button>
            <button onclick="goTo('diag', this)" class="bn-item">IA Diag</button>
        </div>

        <h1 id="sbnm">...</h1>

        <div id="vd" class="view active">
            <h3>Dashboard</h3>
            <p>Serviços: <span id="mv1">0</span></p>
        </div>

        <div id="vi" class="view">
            <h3>Injetores</h3>
            <p>Lista de serviços aqui...</p>
        </div>

        <div id="vdiag" class="view">
            <h3>Diagnóstico IA</h3>
            <input type="text" id="dmod" placeholder="Modelo do Veículo">
            <textarea id="dsin" placeholder="Sintomas..." style="width:100%; height:100px;"></textarea>
            <button id="drbtn" onclick="runDiag()">Analisar com IA</button>
            <div id="dres" style="margin-top:20px; padding:10px; background:#333;"></div>
        </div>
    </div>

    <script>
        // --- DB (localStorage) ---
        const DB = {
            get(k, d = null) { 
                try { const v = localStorage.getItem('snx_' + k); return v !== null ? JSON.parse(v) : d; } 
                catch (e) { return d; } 
            },
            set(k, v) { 
                try { localStorage.setItem('snx_' + k, JSON.stringify(v)); return true; } 
                catch (e) { alert('Memória cheia!'); return false; } 
            },
            del(k) { localStorage.removeItem('snx_' + k); }
        };

        // --- AUTH ---
        const USERS = [
            { u: 'admin', p: 'snx2026', name: 'Administrador', ini: 'AD' },
            { u: 'mecanico', p: 'diesel123', name: 'Mecânico', ini: 'MC' }
        ];
        let CU = null;

        function doLogin() {
            const u = document.getElementById('lu').value.trim();
            const p = document.getElementById('lp').value.trim();
            const f = USERS.find(x => x.u === u && x.p === p);
            
            if (f) {
                CU = f;
                DB.set('sess', f);
                document.getElementById('lerr').style.display = 'none';
                startApp();
            } else {
                document.getElementById('lerr').style.display = 'block';
            }
        }

        function startApp() {
            document.getElementById('ls').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('sbnm').textContent = "Bem-vindo, " + CU.name;
            updateMetrics();
        }

        // --- NAVEGAÇÃO ---
        function goTo(viewId, el) {
            // Esconder todas as vistas
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            // Mostrar a selecionada
            const target = { 'd': 'vd', 'i': 'vi', 'diag': 'vdiag' }[viewId];
            document.getElementById(target).classList.add('active');
            
            // Estilo do botão
            document.querySelectorAll('.bn-item').forEach(b => b.classList.remove('active-nav'));
            el.classList.add('active-nav');
        }

        function updateMetrics() {
            const svcs = DB.get('svcs', []);
            document.getElementById('mv1').textContent = svcs.length;
        }

        // --- IA DIAGNÓSTICO ---
        async function runDiag() {
            const k = DB.get('ak', ''); // Chave da API guardada no DB
            if (!k) { alert('Configura a tua chave API Anthropic primeiro!'); return; }

            const sin = document.getElementById('dsin').value.trim();
            const mod = document.getElementById('dmod').value.trim();
            if (!sin) { alert('Descreve os sintomas.'); return; }

            const btn = document.getElementById('drbtn');
            const resDiv = document.getElementById('dres');
            
            btn.disabled = true;
            resDiv.innerHTML = 'O Claude está a analisar os dados...';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': k,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-haiku-20240307',
                        max_tokens: 800,
                        messages: [{ role: 'user', content: `Especialista Diesel. Veículo: ${mod}. Sintomas: ${sin}. Dá um diagnóstico técnico.` }]
                    })
                });

                const data = await response.json();
                resDiv.innerHTML = data.content[0].text;
            } catch (e) {
                resDiv.innerHTML = 'Erro na ligação com a IA. Verifica a tua chave.';
            } finally {
                btn.disabled = false;
            }
        }

        // Verificar sessão ao carregar
        window.onload = () => {
            const sess = DB.get('sess');
            if (sess) { CU = sess; startApp(); }
        };
    </script>
</body>
</html>
